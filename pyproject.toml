[project]
name = "edgelab"
version = "0.1.0"
description = "NFL Edge Lab — a long-horizon NFL ATS/moneyline research system (snapshot-first data, as-of features, audited predictions)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — personal research project" }
dependencies = [
    "duckdb>=1.1,<2",
    "polars>=1.10,<2",
    "pyarrow>=17",
    "nflreadpy>=0.1.5",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
edgelab = "edgelab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgelab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
